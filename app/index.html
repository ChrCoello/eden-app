<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Eden – arrosage</title>
  <meta name="theme-color" content="#2f6b3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Eden">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
</head>
<body>
  <header>
    <h1>Eden</h1>
    <button id="scan-toggle" aria-pressed="false" title="Afficher le plan scanné">Plan</button>
    <button id="fit" title="Voir tout le jardin">Tout voir</button>
    <ul id="legend" aria-label="Dernier arrosage">
      <li><i data-dry="0"></i>aujourd'hui</li>
      <li><i data-dry="1"></i>1–2 j</li>
      <li><i data-dry="2"></i>3–6 j</li>
      <li><i data-dry="3"></i>7 j et +</li>
      <li><i data-dry="never"></i>jamais</li>
      <li><i data-dry="auto"></i>automatique</li>
    </ul>
  </header>
  <svg id="map" role="img" aria-label="Plan du jardin"></svg>
  <section id="sheet" hidden>
    <button id="close" aria-label="Fermer">×</button>
    <h2 id="zone-id"></h2>
    <p id="zone-name"></p>
    <p id="last-watering"></p>
    <ul id="history" aria-label="Arrosages précédents"></ul>
    <p id="zone-area" class="muted"></p>
    <button id="water" aria-label="Ajouter un arrosage" title="Ajouter un arrosage">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5C9 7 5.5 10.6 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10.6 15 7 12 2.5Z"/></svg>
    </button>
  </section>

  <dialog id="water-dialog">
    <form id="water-form" method="dialog">
      <h3 id="water-title"></h3>
      <label for="by">Nom</label>
      <input id="by" name="by" list="names" required maxlength="40" autocomplete="off" autocapitalize="words">
      <datalist id="names"></datalist>
      <label for="day">Jour</label>
      <input id="day" name="day" type="date" required>
      <p id="water-error" class="error" role="alert"></p>
      <div class="actions">
        <button type="button" id="water-cancel">Annuler</button>
        <button type="submit" id="water-ok" class="primary">OK</button>
      </div>
    </form>
  </dialog>

  <section id="gate" hidden>
    <form id="gate-form">
      <h2>Eden</h2>
      <label for="code">Code du jardin</label>
      <input id="code" required autocomplete="off" autocapitalize="none" spellcheck="false">
      <p class="muted">Demandez-le à la famille. Vous ne le taperez qu'une fois sur ce téléphone.</p>
      <p id="gate-error" class="error" role="alert"></p>
      <button type="submit" class="primary">Entrer</button>
    </form>
  </section>

  <p id="toast" role="status" hidden></p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
